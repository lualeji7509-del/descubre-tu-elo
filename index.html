<style>
html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
body {
  background: #08090c;
  color: #efe9dc;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* Retícula 8x8 de fondo: el tablero como motivo, no como adorno. */
.checker-bg::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(45deg, rgba(217,164,65,.030) 25%, transparent 25%, transparent 75%, rgba(217,164,65,.030) 75%),
    linear-gradient(45deg, rgba(217,164,65,.030) 25%, transparent 25%, transparent 75%, rgba(217,164,65,.030) 75%);
  background-size: 128px 128px;
  background-position: 0 0, 64px 64px;
  mask-image: radial-gradient(120% 80% at 50% 0%, #000 0%, transparent 70%);
  -webkit-mask-image: radial-gradient(120% 80% at 50% 0%, #000 0%, transparent 70%);
}

/* Tipografía: escala fluida y contraste grande entre titular y texto. */
.display { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif; }
.t-hero   { font-size: clamp(2.9rem, 13vw, 6.5rem); line-height: .92; letter-spacing: -.03em; }
.t-huge   { font-size: clamp(3.6rem, 18vw, 7rem);  line-height: .88; letter-spacing: -.04em; }
.t-sec    { font-size: clamp(1.7rem, 6vw, 2.6rem); line-height: 1.05; letter-spacing: -.02em; }
.t-label  { font-size: .66rem; letter-spacing: .32em; text-transform: uppercase; font-weight: 700; }
.balance  { text-wrap: balance; }

/* Filete decorativo con las casillas del tablero. */
.rule-checker {
  height: 6px;
  background-image: linear-gradient(90deg, #d9a441 50%, transparent 50%);
  background-size: 12px 6px;
  opacity: .5;
}

/* Aparición al hacer scroll. */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.3,1); }
.reveal.on { opacity: 1; transform: none; }

.piece { line-height: 1; user-select: none; pointer-events: none; }
button:focus-visible, a:focus-visible { outline: 3px solid #d9a441; outline-offset: 3px; }

@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.animate-shake { animation: shake .25s ease-in-out; }
@keyframes pulseGold { 0%,100%{opacity:.35} 50%{opacity:.9} }
.pulse-gold { animation: pulseGold 2.4s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}
</style>

, schedule and price are agreed directly with her.",classesNote:"No cart, no checkout: you send a message and settle it with the coach. That simple.",classFormats:[{n:"One-to-one",d:"Private coaching with a plan built around your own games. The format that raises your level fastest."},{n:"Group lessons",d:"Small groups at a similar level. Cheaper per head, and you learn from how the others think."},{n:"Seminars and talks",d:"Themed sessions for clubs, schools or companies. One pattern, one opening or one endgame, in depth."}],classCta:"Ask about availability",liveTitle:"Live",liveLead:"Tournaments, annotated games and lesson announcements all go up on their profiles. Follow them so you do not miss it.",liveFollow:"Follow",liveSoon:"Do they have a Twitch or YouTube channel? Once they share it, it will show up here.",footerRights:"All rights reserved.",photoCaption:"Manuela and Jos\xE9 Gabriel, an impromptu game under the Eiffel Tower.",photoCredit:"From their Instagram profiles",photoQuote:"Care for a game at the Eiffel Tower?",photoQuoteBy:"Jos\xE9 Gabriel, in the photo caption",historyTitle:"Checkmates with centuries behind them",historyLead:"The patterns in this test were not invented yesterday. Each one has a name, a date and an author.",tipsTitle:"Five ways to actually improve",tipsLead:"What really moves the needle when you want to get better.",piecesCredit:"Chess pieces by Cburnett and Rfc1394 (Wikimedia Commons).",footerNote:"Indicative result for entertainment: this is not an official FIDE rating. The exercises are classic patterns chosen for this project.",levels:[{max:1199,t:"Beginner Level",s:"Time to learn with Manuela!",p:"p",d:"The spark is there. With steady tactical training you will climb fast."},{max:1800,t:"Club Level",s:"Closing in on the WFM title!",p:"n",d:"You see the patterns and calculate well. Sharpen the finish and you are tournament ready."},{max:9999,t:"Master Level",s:"A GM mind, like Jos\xE9 Gabriel!",p:"q",d:"Deep calculation and an e
